<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Rich Cards — typographic answer cards for DeepSeek Harness">
  <title>Rich Cards — 卡片式回答</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="52%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.25" r="0.75">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#5eead4"/>
      <animate attributeName="x1" values="-0.5;0.1;-0.5" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.5;1.1;0.5" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.3" fill="#94a3b8" opacity="0.16"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- DSH badge -->
  <g transform="translate(80,54)">
    <rect width="132" height="30" rx="15" fill="#1e293b" stroke="#334155"/>
    <circle cx="17" cy="15" r="4" fill="#5eead4">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="20" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#cbd5e1">DSH PLUGIN</text>
  </g>

  <!-- Wordmark -->
  <text x="78" y="150" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5" fill="url(#ink)">Rich Cards</text>
  <text x="82" y="196" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="#94a3b8">卡片式回答 · 排版精致的答案，写在围栏块里</text>
  <text x="82" y="232" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" letter-spacing="0.6" fill="#64748b">DeepSeek Harness · 10 block types · card &amp; article layout</text>

  <!-- Mini card -->
  <g opacity="0.98">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
    <g transform="translate(752,58)">
      <rect width="372" height="188" rx="18" fill="#0d1426" stroke="#2b3554"/>
      <rect width="372" height="188" rx="18" fill="none" stroke="#6366f1" stroke-opacity="0.25"/>

      <rect x="26" y="26" width="78" height="11" rx="5.5" fill="#6366f1">
        <animate attributeName="width" values="0;78" dur="0.7s" begin="0.2s" fill="freeze"/>
      </rect>
      <rect x="26" y="52" width="228" height="17" rx="8.5" fill="#e2e8f0">
        <animate attributeName="width" values="0;228" dur="0.8s" begin="0.5s" fill="freeze"/>
      </rect>
      <rect x="26" y="84" width="318" height="9" rx="4.5" fill="#64748b">
        <animate attributeName="width" values="0;318" dur="0.9s" begin="0.9s" fill="freeze"/>
      </rect>
      <rect x="26" y="102" width="286" height="9" rx="4.5" fill="#64748b">
        <animate attributeName="width" values="0;286" dur="0.9s" begin="1.1s" fill="freeze"/>
      </rect>

      <rect x="26" y="130" width="152" height="34" rx="9" fill="#16203a" stroke="#334155">
        <animate attributeName="width" values="0;152" dur="0.6s" begin="1.4s" fill="freeze"/>
      </rect>
      <rect x="192" y="130" width="152" height="34" rx="9" fill="#16203a" stroke="#334155">
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.7s" fill="freeze"/>
      </rect>

      <rect x="26" y="130" width="3" height="34" fill="#5eead4">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- accent dots -->
  <circle cx="1124" cy="248" r="4" fill="#5eead4" opacity="0.9"/>
  <circle cx="1150" cy="248" r="4" fill="#a78bfa" opacity="0.8"/>
  <circle cx="1176" cy="248" r="4" fill="#f59e0b" opacity="0.8"/>
</svg>
